name: Sync LeetCode Camp data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync.py'
      - 'data/config.json'
      - 'data/manual.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '19 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leetcode-camp-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public data
        run: python scripts/sync.py
      - name: Commit historical snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync public LeetCode data [skip ci]"
            git push
          fi
